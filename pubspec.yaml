name: qorgai
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  google_maps_flutter: ^2.5.0
  geolocator: ^11.0.0
  permission_handler: ^11.0.0
  easy_localization: ^3.0.1
  animated_text_kit: ^4.2.2
  google_fonts: ^6.1.0
  bubble: ^1.2.1
  cupertino_icons: ^1.0.8
  just_audio: ^0.10.2
  speech_to_text: ^7.0.0
  url_launcher: ^6.2.4
  flutter_web_plugins:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Balmoral
      fonts:
        - asset: assets/fonts/kzbalmoral_regular.ttf

  assets:
    - assets/translations/
    - assets/icons/forum.png
    - assets/icons/chat.png
    - assets/icons/button_pink.png
    - assets/icons/icon_home.png
    - assets/icons/icon_study.png
    - assets/icons/heart1.png
    - assets/icons/Vector1.png


