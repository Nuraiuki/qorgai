services:
  - type: web
    name: qorgai-backend
    env: python
    buildCommand: |
      cd backend
      chmod +x build.sh
      ./build.sh
    startCommand: cd backend && gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        value: admin123
      - key: OPENAI_API_KEY
        sync: false
      - key: FLASK_ENV
        value: production
      - key: FLASK_APP
        value: app.py

  - type: web
    name: qorgai-frontend
    env: static
    staticPublishPath: build/web
    envVars:
      - key: FLUTTER_VERSION
        value: 3.19.0