services:
  - type: web
    name: qorgai-backend
    env: python
    buildCommand: |
      pip install --upgrade pip
      pip install -r backend/requirements.txt
      pip install psycopg2-binary
      cd backend && flask db upgrade
    startCommand: gunicorn backend.app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        value: admin123
      - key: OPENAI_API_KEY
        sync: false
      - key: FLASK_ENV
        value: production
      - key: FLASK_APP
        value: backend.app

  - type: web
    name: qorgai-frontend
    env: static
    staticPublishPath: build/web
    envVars:
      - key: FLUTTER_VERSION
        value: 3.19.0