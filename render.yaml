services:
  - type: web
    name: qorgai-backend
    env: python
    buildCommand: |
      pip install -r backend/requirements.txt
      pip install psycopg2-binary
    startCommand: gunicorn backend.app:app
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        value: admin123
      - key: OPENAI_API_KEY
        sync: false

  - type: web
    name: qorgai-frontend
    env: static
    staticPublishPath: build/web
    envVars:
      - key: FLUTTER_VERSION
        value: 3.19.0